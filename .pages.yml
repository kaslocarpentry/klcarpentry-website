media:
  input: images
  output: /images
  extensions: [jpg, jpeg, png, webp]

content:
  - name: site
    label: Website text and photos
    type: file
    path: content/site.json
    format: json
    fields:
      - name: seo
        label: Google listing (shown in search results)
        type: object
        fields:
          - { name: title, label: Page title, type: string }
          - { name: description, label: Description, type: text }
      - name: business
        label: Business details (phone, email)
        type: object
        fields:
          - { name: name, label: Business name, type: string }
          - { name: tagline, label: Tagline, type: string }
          - { name: phone, label: Phone (as shown on the site), type: string }
          - { name: phoneLink, label: Phone for tap-to-call (+1 and digits only), type: string }
          - { name: email, label: Email, type: string }
          - { name: address, label: Location, type: string }
          - { name: facebook, label: Facebook page link, type: string }
      - name: hero
        label: Top of the home page
        type: object
        fields:
          - { name: headline, label: Headline, type: string }
          - { name: intro, label: Intro paragraph, type: text }
          - { name: image, label: Main photo, type: image }
          - { name: imageAlt, label: Photo description (for accessibility and Google), type: string }
          - { name: caption, label: Photo caption, type: string }
      - name: proof
        label: Three reasons to choose us
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - { name: servicesTitle, label: Services heading, type: string }
      - name: services
        label: Services
        type: object
        list: true
        fields:
          - { name: title, label: Service, type: string }
          - { name: text, label: Description, type: text }
      - { name: workTitle, label: Recent work heading, type: string }
      - name: work
        label: Recent work photos
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image }
          - { name: alt, label: Photo description (for accessibility and Google), type: string }
          - { name: caption, label: Caption, type: string }
      - name: about
        label: About us
        type: object
        fields:
          - { name: title, label: Heading, type: string }
          - { name: paragraphs, label: Paragraphs, type: text, list: true }
          - { name: ownerName, label: Owner name (optional), type: string }
          - { name: ownerRole, label: Owner role (optional), type: string }
          - { name: photo, label: Owner photo (optional), type: image }
          - { name: photoAlt, label: Owner photo description, type: string }
      - name: area
        label: Where we work
        type: object
        fields:
          - { name: title, label: Heading, type: string }
          - { name: paragraphs, label: Paragraphs, type: text, list: true }
      - { name: faqTitle, label: Questions heading, type: string }
      - name: faq
        label: Questions and answers
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
      - name: contact
        label: Contact section
        type: object
        fields:
          - { name: title, label: Heading, type: string }
          - { name: text, label: Text, type: text }
      - { name: footerLinkLabel, label: Footer link label, type: string }

  - name: resources
    label: Resources page
    type: file
    path: content/resources.json
    format: json
    fields:
      - name: seo
        label: Google listing
        type: object
        fields:
          - { name: title, label: Page title, type: string }
          - { name: description, label: Description, type: text }
      - { name: headline, label: Headline, type: string }
      - { name: subheading, label: Subheading, type: string }
      - name: groups
        label: Groups
        type: object
        list: true
        fields:
          - { name: title, label: Group name, type: string }
          - name: items
            label: Links
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string }
              - { name: url, label: Website link, type: string }
              - { name: text, label: Short description, type: text }
      - { name: note, label: Note, type: text }
      - { name: suggestLabel, label: Suggest-a-link label, type: string }
      - { name: contactTitle, label: Contact heading, type: string }
